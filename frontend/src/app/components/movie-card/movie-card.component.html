<div class="card" (click)="abrir.emit(filme)">
  @if (filme.poster_url) {
    <img
      [src]="filme.poster_url"
      [alt]="filme.titulo"
      loading="lazy"
    />
  } @else {
    <div class="no-poster">🎬</div>
  }
  @if (isFavoritado) {
    <span class="fav-badge">★</span>
  }
  <div class="card-info">
    <h4>{{ filme.titulo }}</h4>
    @if (filme.data_lancamento) {
      <span>{{ filme.data_lancamento | slice:0:4 }}</span>
    }
  </div>
</div>
