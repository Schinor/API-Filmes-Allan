name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar segredos descartáveis do teste
        run: |
          echo "CI_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CI_LOG_TOKEN=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Testes unitários (pytest)
        run: |
          pip install -r backend/requirements.txt -r auth-service/requirements.txt -r log-service/requirements.txt pytest fakeredis
          pytest -q

      - name: Build e subida da stack (espera todos ficarem healthy)
        run: docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 240

      - name: Teste 1 - /health do catálogo responde 200
        run: curl --fail --silent --show-error http://localhost:8000/health

      - name: Teste 2 - a cadeia catálogo → auth → banco responde
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -d "username=naoexiste@teste.com&password=errada" \
            http://localhost:8000/api/auth/login)
          echo "login inexistente retornou $code"
          test "$code" = "401"

      - name: Teste 3 - /metrics do catálogo expõe métricas Prometheus
        run: curl --fail --silent http://localhost:8000/metrics | grep -q http_requests_total

      - name: Logs dos containers em caso de falha
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs

      - name: Derrubar stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: catalogo-filmes, context: ".", file: "Dockerfile" }
          - { name: auth-service, context: "./auth-service", file: "auth-service/Dockerfile" }
          - { name: log-service, context: "./log-service", file: "log-service/Dockerfile" }
    steps:
      - uses: actions/checkout@v4

      - name: Variáveis de tag (dono em minúsculas é exigido pelo GHCR)
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ matrix.name }}:sha-${{ env.SHORT_SHA }}
            ghcr.io/${{ env.OWNER }}/${{ matrix.name }}:latest
