services:
  catalogo:
    image: ghcr.io/schinor/catalogo-filmes:${IMAGE_TAG:-latest}
    container_name: catalogo-filmes-schinor
    ports:
      # Se a porta 8000 já estiver em uso por outro aluno, troque a porta da esquerda (ex: 8050:8000)
      - "${PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TMDB_BASE_URL=${TMDB_BASE_URL:-https://api.themoviedb.org/3}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - PORT=8000
      - AUTH_SERVICE_URL=http://auth-service-schinor:8001
      - LOG_SERVICE_URL=http://log-service:8002
      - LOG_INTERNAL_TOKEN=${LOG_INTERNAL_TOKEN}
    depends_on:
      auth-service:
        condition: service_healthy
      log-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - filmes-network
    restart: unless-stopped

  auth-service:
    image: ghcr.io/schinor/auth-service:${IMAGE_TAG:-latest}
    container_name: auth-service-schinor
    expose:
      - "8001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - PORT=8001
      - MAILTRAP_HOST=${MAILTRAP_HOST:-sandbox.smtp.mailtrap.io}
      - MAILTRAP_PORT=${MAILTRAP_PORT:-2525}
      - MAILTRAP_USERNAME=${MAILTRAP_USERNAME:-}
      - MAILTRAP_PASSWORD=${MAILTRAP_PASSWORD:-}
      - MAILTRAP_FROM_EMAIL=${MAILTRAP_FROM_EMAIL:-nao-responda@tomhanksfilmes.com}
      - MAILTRAP_FROM_NAME=${MAILTRAP_FROM_NAME:-Tom Hanks Filmes}
      - CATALOGO_URL=${CATALOGO_URL:-http://localhost:8000}
      - RESET_TOKEN_EXPIRE_MINUTES=${RESET_TOKEN_EXPIRE_MINUTES:-30}
      - RESET_REQUEST_LIMIT=${RESET_REQUEST_LIMIT:-3}
      - RESET_REQUEST_WINDOW_MINUTES=${RESET_REQUEST_WINDOW_MINUTES:-15}
      - EMAIL_LOG_LINK_WITHOUT_SMTP=${EMAIL_LOG_LINK_WITHOUT_SMTP:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - filmes-network
    restart: unless-stopped

  log-service:
    image: ghcr.io/schinor/log-service:${IMAGE_TAG:-latest}
    container_name: log-service-schinor
    expose:
      - "8002"                # Sem "ports:" — não é publicado no host
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_INTERNAL_TOKEN=${LOG_INTERNAL_TOKEN}
      - PORT=8002
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - filmes-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    # Sem "ports:" — só o log-service acessa o Redis, pela rede interna
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - filmes-network
    restart: unless-stopped

  prometheus:
    image: ghcr.io/schinor/prometheus:${IMAGE_TAG:-latest}
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - catalogo
      - auth-service
      - log-service
    networks:
      - filmes-network
    restart: unless-stopped

  grafana:
    image: ghcr.io/schinor/grafana:${IMAGE_TAG:-latest}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - filmes-network
    restart: unless-stopped

networks:
  filmes-network:
    driver: bridge
    ipam:
      driver: default
      config:
        # Sub-rede fixa: evita a alocação automática do Docker, cujo pool de
        # redes pré-definidas ("predefined address pools") já foi esgotado
        # no host compartilhado entre os alunos. Se o deploy falhar com
        # "Pool overlaps with other one on this address space", troque o
        # segundo octeto (ex: 10.21.30.0/28) até não colidir com a de outro aluno.
        - subnet: 10.20.30.0/28

volumes:
  redis-data:
  grafana-data:
